repos:
  - repo: https://github.com/bitnami/readme-generator-for-helm
    rev: 4d29f59abac6aeed6fbc2467e24fc17560057bcb # 3.0.1
    hooks:
      - id: helm-readme-generator
        entry: bash scripts/helm/generate.sh
        language_version: system
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      # Check the whole ownership map even when only a referenced path changes.
      - id: codeowners
        name: CODEOWNERS syntax and paths
        entry: env REPOSITORY_PATH=. CHECKS=files,duppatterns,syntax EXPERIMENTAL_CHECKS= CHECK_FAILURE_LEVEL=warning codeowners-validator
        language: golang
        language_version: 1.27.2
        additional_dependencies:
          - github.com/mszostok/codeowners-validator@7f3f5e28c6d7b8dfae5731e54ce2272ca384592f # v0.7.4
        pass_filenames: false
        always_run: true
      - id: ruff
        name: Ruff lint
        entry: poetry run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: Strict mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pydocstyle
        name: Google docstring style
        entry: poetry run pydocstyle
        language: system
        types: [python]
      - id: pydoclint
        name: Typed docstring contracts
        entry: poetry run pydoclint
        language: system
        types: [python]
      - id: sqlfluff
        name: SQLFluff SQLite contracts
        entry: poetry run sqlfluff lint
        language: system
        types: [sql]
      - id: shellcheck
        name: ShellCheck
        entry: poetry run shellcheck
        language: system
        types: [shell]
      - id: shfmt
        name: Shell formatting
        entry: poetry run shfmt -d -i 4
        language: system
        types: [shell]
      - id: documentation-contents
        name: README table of contents (maximum three layers)
        entry: poetry run python scripts/documentation/contents.py
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation-syntax
        name: Markdown math and Mermaid syntax
        entry: npm --prefix scripts/documentation run check
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation-javascript
        name: Documentation tooling JavaScript
        entry: npm --prefix scripts/documentation run lint
        language: system
        pass_filenames: false
        files: '^scripts/documentation/.*\.(mjs|json)$'
      - id: actionlint
        name: GitHub Actions contracts
        entry: actionlint
        language: system
        pass_filenames: false
        files: '^\.github/.*\.ya?ml$'
