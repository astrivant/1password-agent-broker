repository:
  description: Let agents use approved 1Password-backed capabilities without receiving secret values.
  homepage: https://github.com/astrivant/1password-agent-broker#quick-start
  topics: [1password, mcp, agents, security, python]
  has_issues: true
  has_wiki: false
  delete_branch_on_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        # Pin the stable gate to GitHub Actions, not a runtime-specific matrix name.
        checks:
          - context: PR quality gate
            app_id: 15368
      # Administrators may override after explicit maintainer approval and passing CI.
      enforce_admins: false
      restrictions: null
      required_conversation_resolution: true
      required_linear_history: false
      allow_force_pushes: false
      allow_deletions: false
