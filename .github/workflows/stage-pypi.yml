name: Verified PyPI publication
on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable caller revision for every checkout in this stage
        required: true
        type: string
      release_tag:
        description: Signed release tag whose Python archives will be authenticated and published
        required: true
        type: string
    secrets:
      PYPI_API_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  pypi-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Authenticate published release bytes and check retry compatibility
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PYPI_RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_RELEASE_KEY_FINGERPRINT: c025b0ffd4e676db5710697b756ed9b4a46025966b26faface444f3318c8513f
        run: bash scripts/release/prepare-pypi.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: pypi-dist/
          if-no-files-found: error

  pypi:
    name: Publish Python package to PyPI
    needs: pypi-prepare
    if: >-
      !cancelled()
      && needs.pypi-prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/1password-agent-broker/
    concurrency:
      group: pypi-${{ needs.pypi-prepare.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/
      - name: Require the organization's existing publishing credential
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo '::error::Grant this repository access to the organization PYPI_API_TOKEN secret.'
            exit 1
          fi
      - name: Publish verified Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
          skip-existing: true

  pypi-verification:
    name: Verify PyPI files and installed demo
    needs: [pypi-prepare, pypi]
    if: >-
      !cancelled()
      && needs.pypi-prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: pypi-dist/
      - name: Require a successful publisher
        env:
          PUBLISH_RESULT: ${{ needs.pypi.result }}
        run: test "$PUBLISH_RESULT" = success
      - name: Verify registry identity and exercise the installed package
        env:
          RELEASE_VERSION: ${{ needs.pypi-prepare.outputs.version }}
        run: bash scripts/release/check-install.sh
