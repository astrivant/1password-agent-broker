name: Measured coverage publication
on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable caller revision for every checkout in this stage
        required: true
        type: string
permissions:
  contents: read
jobs:
  coverage:
    name: Publish measured coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-3.14.8
          path: artifacts/coverage
      - run: python scripts/ci/checks/coverage.py
      - name: Publish without changing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/checks/publish-coverage.sh
