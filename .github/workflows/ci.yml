name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python
      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --dir "$RUNNER_TEMP/actionlint" \
            --pattern "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" --pattern "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP/actionlint"
          sha256sum --check --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: poetry run pre-commit run --all-files
      - run: poetry run python scripts/documentation/contents.py --check
      - run: git diff --exit-code
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgresql:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: broker
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROKER_TEST_POSTGRES: '1'
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: broker
      PGUSER: postgres
      PGSSLMODE: disable
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.15', '3.14.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python
        with:
          python-version: ${{ matrix.python }}
      - run: poetry run pytest -n 4 --cov=agent_broker --cov-report=term-missing --cov-report=xml
      - run: poetry run agent-broker demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
  coverage:
    name: Publish measured coverage
    needs: tests
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-3.14.8
          path: artifacts/coverage
      - run: python scripts/ci/checks/coverage.py
      - name: Publish without changing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/checks/publish-coverage.sh
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python
      - name: Require tag and metadata agreement
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "v$(poetry version --short)" = "$RELEASE_TAG"
      - run: poetry build
      - name: Test installed wheel independently of checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/agent-broker" demo
      - name: Build and verify production container
        run: |
          docker build --target production -t broker:test .
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges broker:test agent-broker demo
          docker run --rm broker:test python -c 'from onepassword import Secrets; Secrets.validate_secret_reference("op://synthetic/item/token")'
          docker build --target development -t broker:development .
          docker run --rm broker:development pytest -n 4 -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/python
      - name: Install pinned Helm and kubeconform
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/helm/install-tools.sh
      - name: Install locked chart test environment
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: 'true'
        run: |
          python -m venv "$PWD/scripts/helm/.venv"
          VIRTUAL_ENV="$PWD/scripts/helm/.venv" poetry -C scripts/helm install --no-interaction
      - run: bash scripts/helm/check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error
  release-contract:
    needs: [package, charts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify draft publication and reject corrupted downloads
        run: bash scripts/ci/checks/release.sh
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Select six-hour vulnerability cache window
        id: cache-window
        run: echo "value=$(($(date +%s) / 21600))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-0.75.0-${{ runner.os }}-${{ steps.cache-window.outputs.value }}
      - run: bash scripts/ci/checks/security.sh artifacts/security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: redacted-security-results
          path: artifacts/security/security.json
          if-no-files-found: warn
  release:
    needs: [lint, tests, package, charts, release-contract, security]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'astrivant/1password-agent-broker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helm-chart
          path: dist/
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign and publish checked distributions
        env:
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: bash scripts/release/publish.sh
  release-verification:
    needs: release
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'astrivant/1password-agent-broker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Require the complete signed release for this source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_KEY_FINGERPRINT: c025b0ffd4e676db5710697b756ed9b4a46025966b26faface444f3318c8513f
        run: bash scripts/release/verify.sh
