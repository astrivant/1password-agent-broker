name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pypi_release:
        description: Existing signed GitHub release to publish or retry on PyPI (vX.Y.Z; run from main)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.pypi_release || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  # Independent source checks start together; stage files do not impose barriers.
  lint:
    uses: ./.github/workflows/stage-lint.yml
    with:
      source_sha: ${{ github.sha }}

  tests:
    uses: ./.github/workflows/stage-tests.yml
    with:
      source_sha: ${{ github.sha }}

  coverage:
    needs: tests
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/stage-coverage.yml
    with:
      source_sha: ${{ github.sha }}

  package:
    uses: ./.github/workflows/stage-package.yml
    with:
      source_sha: ${{ github.sha }}

  charts:
    uses: ./.github/workflows/stage-charts.yml
    with:
      source_sha: ${{ github.sha }}

  release-contract:
    needs: [package, charts]
    uses: ./.github/workflows/stage-release-contract.yml
    with:
      source_sha: ${{ github.sha }}

  security:
    uses: ./.github/workflows/stage-security.yml
    with:
      source_sha: ${{ github.sha }}

  # Keep this check at the entry point so branch protection retains its exact name.
  quality-gate:
    name: PR quality gate
    needs: [lint, tests, package, charts, release-contract, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Require every validation job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/ci/checks/quality-gate.sh

  release:
    needs: [lint, tests, package, charts, release-contract, security]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'astrivant/1password-agent-broker'
    permissions:
      contents: write
    uses: ./.github/workflows/stage-release.yml
    with:
      source_sha: ${{ github.sha }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  release-verification:
    needs: release
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/v')
      && github.repository == 'astrivant/1password-agent-broker'
    uses: ./.github/workflows/stage-release-verification.yml
    with:
      source_sha: ${{ github.sha }}

  # A manual retry may bypass a skipped tag verifier, but never failed validation.
  pypi:
    needs: [lint, tests, package, charts, release-contract, security, release-verification]
    if: >-
      !cancelled()
      && github.repository == 'astrivant/1password-agent-broker'
      && needs.lint.result == 'success'
      && needs.tests.result == 'success'
      && needs.package.result == 'success'
      && needs.charts.result == 'success'
      && needs.release-contract.result == 'success'
      && needs.security.result == 'success'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
           && needs.release-verification.result == 'success')
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
              && inputs.pypi_release != ''))
    uses: ./.github/workflows/stage-pypi.yml
    with:
      source_sha: ${{ github.sha }}
      release_tag: ${{ inputs.pypi_release || github.ref_name }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
