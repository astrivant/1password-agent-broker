name: Helm validation and packaging
on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable caller revision for every checkout in this stage
        required: true
        type: string
permissions:
  contents: read
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/python
      - name: Install pinned Helm and kubeconform
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/helm/install-tools.sh
      - name: Install locked chart test environment
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: 'true'
        run: |
          python -m venv "$PWD/scripts/helm/.venv"
          VIRTUAL_ENV="$PWD/scripts/helm/.venv" poetry -C scripts/helm install --no-interaction
      - run: bash scripts/helm/check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-chart
          path: dist/*.tgz
          if-no-files-found: error
