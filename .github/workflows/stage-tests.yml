name: Python and PostgreSQL tests
on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable caller revision for every checkout in this stage
        required: true
        type: string
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgresql:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: broker
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BROKER_TEST_POSTGRES: '1'
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: broker
      PGUSER: postgres
      PGSSLMODE: disable
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.15', '3.14.8']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - uses: ./.github/actions/python
        with:
          python-version: ${{ matrix.python }}
      - run: poetry run pytest -n 4 --cov=agent_broker --cov-report=term-missing --cov-report=xml
      - run: poetry run agent-broker demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
