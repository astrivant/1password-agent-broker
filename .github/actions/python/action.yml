name: Locked Python environment
description: Reuse a Python-version-specific virtual environment from the committed lockfile.
inputs:
  python-version:
    description: Exact supported Python version
    default: 3.14.8
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: environment
      with:
        path: .venv
        key: broker-venv-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml', 'packages/sdk/**') }}
    - name: Install Poetry
      shell: bash
      run: python -m pip install poetry==2.5.1
    - name: Install locked dependencies
      if: steps.environment.outputs.cache-hit != 'true'
      shell: bash
      env:
        POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      run: poetry install --no-interaction
    - name: Expose project commands
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Refresh current runtime metadata
      shell: bash
      run: poetry install --only-root --no-interaction
