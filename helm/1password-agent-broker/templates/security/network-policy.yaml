{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "broker.name" . }}
  labels:
    {{- include "broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "broker.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.clientNamespace | quote }}
          podSelector:
            matchLabels:
              broker-client: "true"
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
          podSelector:
            matchLabels:
              broker-monitor: "true"
      ports:
        - protocol: TCP
          port: 9090
{{- end }}
