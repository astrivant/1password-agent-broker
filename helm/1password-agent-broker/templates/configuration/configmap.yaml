apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "broker.name" . }}
  labels:
    {{- include "broker.labels" . | nindent 4 }}
data:
  policy.json: {{ .Values.configuration.policy | toJson | quote }}
  approvals.json: {{ .Values.configuration.approvals | toJson | quote }}
  {{- if .Values.crypto.enabled }}
  crypto.json: {{ .Values.crypto.policy | toJson | quote }}
  {{- end }}
