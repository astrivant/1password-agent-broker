# The transport supplies the verified certificate; the operator owns the grant.
# Scope names and payload fields are never accepted as caller-defined policy code.
[request_definition]
r = fingerprint, grant, request, now

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = !r.grant.revoked \
    && r.now < r.grant.expires_at \
    && r.fingerprint == r.grant.certificate_sha256 \
    && r.grant.tenant == r.request.binding.tenant \
    && r.grant.identity == r.request.binding.identity \
    && r.grant.task == r.request.task \
    && r.grant.authority == r.request.authority \
    && r.grant.policy == r.request.policy \
    && r.request.action in r.grant.actions \
    && r.request.key in r.grant.keys \
    && (r.grant.all_records || r.request.binding.record in r.grant.records)
