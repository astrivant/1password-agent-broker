[project]
name = "1password-agent-broker"
version = "0.4.1"
description = "Let agents use approved 1Password-backed capabilities without receiving secret values"
readme = "README.md"
requires-python = ">=3.12,!=3.14.1,<4"
license = "Apache-2.0"
authors = [{ name = "Astrivant" }]
dependencies = [
    "1password-agent-broker-sdk==0.4.1",
    "attrs==26.1.0",
    "pycasbin==2.8.0",
    "cattrs==26.2.1",
    "jsonschema==4.26.0",
    "cryptography==50.0.2",
    "Flask==3.1.3",
    "cheroot==11.1.2",
    "mcp==2.3.0",
    "onepassword-sdk==0.4.1",
    "opentelemetry-api==1.45.1",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/astrivant/1password-agent-broker"
Documentation = "https://github.com/astrivant/1password-agent-broker/blob/main/docs/operations.md"

[project.scripts]
agent-broker = "agent_broker.cli:main"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agent_broker", from = "src" }]
include = [{ path = "src/agent_broker/resources", format = ["sdist", "wheel"] }]

[tool.ruff]
extend = "../../../pyproject.toml"
