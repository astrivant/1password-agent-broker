[project]
name = "broker-workspace"
requires-python = ">=3.12,!=3.14.1,<4"
dependencies = ["1password-agent-broker==0.4.1", "1password-agent-broker-sdk==0.4.1"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
1password-agent-broker = { path = "pkg/python/broker", develop = true }
1password-agent-broker-sdk = { path = "pkg/python/broker_sdk", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = "0.17.0"
mypy = "2.4.0"
pydocstyle = "6.3.0"
pydoclint = "0.11.0"
pre-commit = "4.6.2"
pytest = "9.1.1"
pytest-xdist = "3.8.0"
pytest-cov = "7.1.0"
sqlfluff = "4.4.0"
types-jsonschema = "4.26.0.20261006"
shellcheck-py = "0.11.0.1"
shfmt-py = "4.2.0"
PyYAML = "6.0.3"
types-PyYAML = "6.0.12.20260906"
hypothesis = "6.169.0"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "TC"]
ignore = ["D200", "D202", "D212"]
extend-select = ["D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
files = ["pkg", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["onepassword.*", "casbin.*"]
follow_untyped_imports = true

[tool.pydocstyle]
convention = "google"
add-ignore = ["D200", "D202", "D212"]
add-select = ["D213"]
match = ".*\\.py"

[tool.pydoclint]
exclude = "\\.git|\\.tox|\\.venv|\\.cache"
allow-init-docstring = true
style = "google"
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-arg-order = true
require-return-section-when-returning-nothing = true
skip-checking-raises = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n auto --import-mode=importlib"

[tool.coverage.run]
source = ["agent_broker", "agent_broker_sdk"]

[tool.sqlfluff.core]
dialect = "sqlite"
max_line_length = 140
